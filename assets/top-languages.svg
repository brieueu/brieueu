<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" role="img" aria-labelledby="title description">
  <title id="title">Top Languages by Repo</title>
  <desc id="description">Top five primary languages across Gabriel's public repositories, each shown with a distinct Tokyo Night color.</desc>

  <style>
    .card-title { fill: #70A5FD; }
    .card-label { fill: #38BDAE; }
    @media (prefers-color-scheme: light) {
      .card-title { fill: #0969DA; }
      .card-label { fill: #0F766E; }
    }
  </style>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text class="card-title" x="30" y="40" font-size="23" font-weight="500">Top Languages by Repo</text>

    <g class="card-label" font-size="14">
      <rect x="40" y="59" width="12" height="12" rx="1" fill="#7AA2F7"/>
      <text x="57" y="70">Python</text>

      <rect x="40" y="82" width="12" height="12" rx="1" fill="#BB9AF7"/>
      <text x="57" y="93">Jupyter Notebook</text>

      <rect x="40" y="105" width="12" height="12" rx="1" fill="#9ECE6A"/>
      <text x="57" y="116">C</text>

      <rect x="40" y="128" width="12" height="12" rx="1" fill="#E0AF68"/>
      <text x="57" y="139">HTML</text>

      <rect x="40" y="151" width="12" height="12" rx="1" fill="#F7768E"/>
      <text x="57" y="162">TypeScript</text>
    </g>
  </g>

  <g fill="none" stroke-width="22" transform="rotate(-90 250 116)">
    <circle cx="250" cy="116" r="48" stroke="#7AA2F7" stroke-dasharray="106.64 194.95" stroke-dashoffset="0"/>
    <circle cx="250" cy="116" r="48" stroke="#BB9AF7" stroke-dasharray="79.23 222.36" stroke-dashoffset="-109.66"/>
    <circle cx="250" cy="116" r="48" stroke="#9ECE6A" stroke-dasharray="51.81 249.78" stroke-dashoffset="-191.93"/>
    <circle cx="250" cy="116" r="48" stroke="#E0AF68" stroke-dasharray="24.40 277.19" stroke-dashoffset="-246.76"/>
    <circle cx="250" cy="116" r="48" stroke="#F7768E" stroke-dasharray="24.40 277.19" stroke-dashoffset="-274.18"/>
  </g>
</svg>
